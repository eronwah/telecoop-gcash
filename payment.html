<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Portal</title>
    <!-- Gumagamit tayo ng ?v=3 para hindi mag-cache ang lumang CSS -->
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <div class="portal-container">
        <img src="assets/mainlogo.png" alt="Main Logo" class="portal-logo">
        
        <div class="payment-instructions">
            <p>Please transfer your payment to</p>
            <div class="gcash-number">GCash Number : 09770927222</div>
            <p class="upload-note">Once completed, kindly upload the screenshot of the receipt of your payment.</p>
            
            <input type="file" id="receiptUpload" class="upload-btn" accept="image/*">
            
            <!-- Back Button -->
            <button class="back-link-btn" onclick="goToHome()">Back to Search</button>
        </div>

    </div>

    <script>
        function goToHome() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
