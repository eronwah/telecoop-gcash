<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login</title>
    <!-- Gumagamit tayo ng ?v=4 para siguradong babasahin ang bagong CSS -->
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <div class="portal-container">
        <img src="assets/mainlogo.png" alt="Main Logo" class="portal-logo">
        
        <form id="lookupForm">
            <div class="input-group">
                <label for="account-number">Enter your Account Number</label>
                <input 
                    type="text" 
                    id="account-number" 
                    placeholder="makikita sa ibabaw ng modem ang inyong account number"
                    maxlength="7" 
                    minlength="7" 
                    pattern="\d{7}" 
                    title="Mangyaring maglagay ng eksaktong 7 numero"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    required
                >
            </div>
            
            <button type="submit" class="search-btn" id="searchBtn">Search</button>
        </form>

        <div id="resultContainer" class="result-container" style="display: none;">
            <div id="errorMessage" class="error-text"></div>
            
            <div id="accountDetails" class="account-details" style="display: none;">
                <h3>Account Details</h3>
                
                <!-- Bagong structure para sa maayos na alignment -->
                <div class="detail-row">
                    <span class="detail-label">Name</span>
                    <span class="detail-value" id="resName"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Membership Level</span>
                    <span class="detail-value" id="resLevel"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Due Date</span>
                    <span class="detail-value" id="resDueDate"></span>
                </div>
                
                <div class="payment-section">
                    <p class="payment-question">Are you paying for this account?</p>
                    <div class="button-group">
                        <button class="yes-btn" onclick="goToPayment()">Yes</button>
                        <button class="no-btn" onclick="resetForm()">No, Search again</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-U2zizYszAFELKvLBBI74ltCdzeoP4_ztBCx9X2lzmoCs0yxUncjtgueEBb5jNotK_w/exec';

        document.getElementById('lookupForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const accNum = document.getElementById('account-number').value;
            const btn = document.getElementById('searchBtn');
            const resultContainer = document.getElementById('resultContainer');
            const errorMsg = document.getElementById('errorMessage');
            const accountDetails = document.getElementById('accountDetails');
            
            btn.innerText = 'Searching...';
            btn.disabled = true;
            resultContainer.style.display = 'none';
            errorMsg.style.display = 'none';
            accountDetails.style.display = 'none';

            fetch(`${APPS_SCRIPT_URL}?accountNumber=${accNum}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    btn.innerText = 'Search';
                    btn.disabled = false;
                    resultContainer.style.display = 'block';

                    if (data.status === 'success') {
                        let fullName = `${data.firstName} ${data.middleName} ${data.lastName} ${data.suffix}`.trim();
                        
                        document.getElementById('resName').innerText = fullName;
                        document.getElementById('resLevel').innerText = data.membershipLevel;
                        document.getElementById('resDueDate').innerText = data.dueDate; 
                        
                        accountDetails.style.display = 'block';
                        document.getElementById('lookupForm').style.display = 'none'; 
                    } else {
                        errorMsg.innerText = data.message;
                        errorMsg.style.display = 'block';
                    }
                })
                .catch(error => {
                    btn.innerText = 'Search';
                    btn.disabled = false;
                    resultContainer.style.display = 'block';
                    errorMsg.innerText = 'May problema sa koneksyon. Subukan muli.';
                    errorMsg.style.display = 'block';
                });
        });

        function resetForm() {
            document.getElementById('lookupForm').style.display = 'block';
            document.getElementById('resultContainer').style.display = 'none';
            document.getElementById('account-number').value = '';
        }

        function goToPayment() {
            window.location.href = 'payment.html';
        }
    </script>
</body>
</html>
