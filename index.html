<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login</title>
    <!-- Dito nakakonekta ang CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="portal-container">
        <!-- Flexible logo mula sa assets folder -->
        <img src="assets/mainlogo.png" alt="Main Logo" class="portal-logo">
        
        <!-- Gumamit tayo ng form tag para gumana ang validation -->
        <form action="#" method="POST">
            <div class="input-group">
                <label for="account-number">Enter your Account Number</label>
                <input 
                    type="text" 
                    id="account-number" 
                    placeholder="makikita sa ibabaw ng modem ang inyong account number"
                    maxlength="7" 
                    minlength="7" 
                    pattern="\d{7}" 
                    title="Mangyaring maglagay ng eksaktong 7 numero"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    required
                >
            </div>
            
            <button type="submit" class="search-btn">Search</button>
        </form>
    </div>

</body>
</html>
